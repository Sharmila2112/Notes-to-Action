openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runs
    description: Task extraction runs and their event histories
  - name: tasks
    description: Extracted tasks
security:
  - clerkSession: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List the signed-in user's extraction runs
      description: Bounded newest-first history with short note previews. Follow next_cursor for older records; full notes remain available only on the owner-scoped run detail endpoint.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: Opaque next_cursor from the preceding page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "400":
          description: Invalid pagination limit or cursor
        "401":
          description: Sign-in required
        "200":
          description: One page ordered by start time and ID descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
    post:
      operationId: createRun
      tags: [runs]
      summary: Start a task extraction run
      description: Ownership is assigned from the authenticated session, never from request input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "401":
          description: Sign-in required
        "202":
          description: Run accepted or failed input was persisted with its event history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run and its extracted tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          description: Sign-in required
        "200":
          description: Run with tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: Run not found or owned by another user
  /runs/{id}/tasks/{cursor}:
    get:
      operationId: getRunTasks
      tags: [tasks]
      summary: Get one page of a run's tasks
      description: Owner-scoped task pagination for large run details. Use the literal start cursor for the first page, then the returned next_cursor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: path
          required: true
          description: The literal start for the first page, or a task ID returned as next_cursor.
          schema:
            type: string
            maxLength: 36
            pattern: "^(start|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
      responses:
        "400":
          description: Invalid task page limit or cursor
        "401":
          description: Sign-in required
        "200":
          description: One page of tasks ordered by title and ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "404":
          description: Run not found or owned by another user
  /runs/{id}/events:
    get:
      operationId: getRunEvents
      tags: [runs]
      summary: Get the persisted event history for a run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          description: Sign-in required
        "200":
          description: Run events in recorded order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunEvent"
        "404":
          description: Run not found or owned by another user
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task completion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "401":
          description: Sign-in required
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found or its run is owned by another user
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Replit-managed Clerk session cookie. Runs, tasks, and events are private to the authenticated user.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RunStatus:
      type: string
      enum: [pending, running, succeeded, failed]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    RunEventStatus:
      type: string
      enum: [started, succeeded, failed, retrying]
    RunInput:
      type: object
      required: [input_text, simulate_failures]
      properties:
        input_text:
          type: string
        simulate_failures:
          type: boolean
    Run:
      type: object
      required: [id, input_text, status, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        input_text:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: ["string", "null"]
          format: date-time
        error:
          type: ["string", "null"]
    RunListItem:
      type: object
      required: [id, input_preview, status, started_at, finished_at, task_count]
      properties:
        id:
          type: string
          format: uuid
        input_preview:
          type: string
          description: At most 200 Unicode characters of the source notes, never the complete note payload for long notes.
        status:
          $ref: "#/components/schemas/RunStatus"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: ["string", "null"]
          format: date-time
        task_count:
          type: integer
    RunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RunListItem"
        next_cursor:
          type: ["string", "null"]
          description: Pass as cursor to fetch older runs; null means no older page remains.
    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [tasks]
          properties:
            tasks:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/Task"
            task_count:
              type: integer
              minimum: 0
              description: Total tasks in the run, including tasks on subsequent pages.
            next_tasks_cursor:
              type: ["string", "null"]
              format: uuid
              description: ID of the last task in the initial page, or null when the complete task list is included.
    TaskPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Task"
        next_cursor:
          type: ["string", "null"]
          format: uuid
          description: ID of the last task in this page, or null when no further tasks remain.
    RunEvent:
      type: object
      required:
        [id, run_id, sequence, step, status, timestamp, duration_ms, detail, attempt]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        sequence:
          type: integer
        step:
          type: string
          enum:
            [receive_input, create_run, call_model, parse_output, save_tasks, finish_run]
        status:
          $ref: "#/components/schemas/RunEventStatus"
        timestamp:
          type: string
          format: date-time
        duration_ms:
          type: integer
        detail:
          type: string
        attempt:
          type: integer
    Task:
      type: object
      required: [id, run_id, title, owner, due_date, priority, done]
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        title:
          type: string
        owner:
          type: string
        due_date:
          type: ["string", "null"]
          description: Calendar date in YYYY-MM-DD format, or null when no due date was stated.
        priority:
          $ref: "#/components/schemas/TaskPriority"
        done:
          type: boolean
    TaskUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean

